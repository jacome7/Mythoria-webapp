steps:
  # Get secrets from Secret Manager for build args
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Retrieve secrets and set as environment variables for subsequent steps
        echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=mythoria-clerk-publishable-key)" >> /workspace/build-env
        echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=$(gcloud secrets versions access latest --secret=mythoria-ga-measurement-id)" >> /workspace/build-env
        echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)" >> /workspace/build-env

  # Build the container image with secrets from Secret Manager
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Load build environment variables
        source /workspace/build-env

        # Build with secrets as build args
        docker build \
          --build-arg NODE_VERSION="${_NODE_VERSION}" \
          -t gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA \
          -t gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest \
          --build-arg APP_GIT_SHA="${_GIT_SHA}" \
          --build-arg NEXT_PUBLIC_BASE_URL="${_NEXT_PUBLIC_BASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPPORTED_LOCALES="${_NEXT_PUBLIC_SUPPORTED_LOCALES}" \
          --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$$NEXT_PUBLIC_GA_MEASUREMENT_ID" \
          --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
          --build-arg NEXT_PUBLIC_GOOGLE_ADS_ID="${_NEXT_PUBLIC_GOOGLE_ADS_ID}" \
          --build-arg NEXT_PUBLIC_GOOGLE_TAG_ID="${_NEXT_PUBLIC_GOOGLE_TAG_ID}" \
          --build-arg NEXT_PUBLIC_OPENAI_PIXEL_ID="${_NEXT_PUBLIC_OPENAI_PIXEL_ID}" \
          --build-arg NEXT_PUBLIC_OPENAI_PIXEL_DEBUG="${_NEXT_PUBLIC_OPENAI_PIXEL_DEBUG}" \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="${_CLERK_SIGN_IN_URL}" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="${_CLERK_SIGN_UP_URL}" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL="${_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL}" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL="${_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL}" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL="${_CLERK_SIGN_UP_FORCE_REDIRECT_URL}" \
          --build-arg NEXT_PUBLIC_CLERK_IS_DEVELOPMENT="${_NEXT_PUBLIC_CLERK_IS_DEVELOPMENT}" \
          --build-arg NEXT_PUBLIC_TTS_PROVIDER="${_NEXT_PUBLIC_TTS_PROVIDER}" \
          --build-arg NEXT_PUBLIC_DEFAULT_CURRENCY="${_NEXT_PUBLIC_DEFAULT_CURRENCY}" \
          --build-arg NEXT_PUBLIC_APP_DOMAIN="${_NEXT_PUBLIC_APP_DOMAIN}" \
          --build-arg NEXT_PUBLIC_ASSETS_BASE_URL="${_NEXT_PUBLIC_ASSETS_BASE_URL}" \
          .

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME'

  # Release an image to an existing service, retaining its runtime settings.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '$_SERVICE_NAME'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'
      - '--region'
      - '$_REGION'
      - '--project'
      - '$PROJECT_ID'
      - '--update-labels'
      - 'git-sha=${_GIT_SHA},cloud-build-id=$BUILD_ID'
      - '--update-env-vars'
      - 'APP_GIT_SHA=${_GIT_SHA},ANONYMOUS_ANALYTICS_ENABLED=${_ANONYMOUS_ANALYTICS_ENABLED},ANALYTICS_PRIVACY_PAUSE=${_ANALYTICS_PRIVACY_PAUSE},ANALYTICS_DELIVERY_TARGET=${_ANALYTICS_DELIVERY_TARGET},OPENAI_ADS_CAPI_DELIVERY_ENABLED=${_OPENAI_ADS_CAPI_DELIVERY_ENABLED}'
      - '--quiet'
      # Existing Cloud Run environment variables.
      # env-parity-preserved: NODE_ENV,NEXT_PUBLIC_BASE_URL,NEXT_PUBLIC_SUPPORTED_LOCALES,NEXT_PUBLIC_TTS_PROVIDER
      # env-parity-preserved: NEXT_PUBLIC_DEFAULT_CURRENCY,NEXT_PUBLIC_APP_DOMAIN,NEXT_PUBLIC_ASSETS_BASE_URL,STRIPE_API_VERSION
      # env-parity-preserved: STRIPE_CREDIT_TAX_CODE,KEYINVOICE_ENABLED,KEYINVOICE_API_URL,KEYINVOICE_DRAFT_ONLY
      # env-parity-preserved: KEYINVOICE_DOC_TYPE,KEYINVOICE_DOC_SERIES_ID,KEYINVOICE_PAYMENT_METHOD_ID_STRIPE
      # env-parity-preserved: KEYINVOICE_TAX_ID_BY_RATE_JSON,KEYINVOICE_FALLBACK_TAX_ID,KEYINVOICE_PRODUCT_IDS_BY_PACKAGE_KEY_JSON
      # env-parity-preserved: KEYINVOICE_REGISTER_AT,DB_PORT,DB_NAME,CLERK_SIGN_IN_URL,CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
      # env-parity-preserved: CLERK_SIGN_UP_URL,CLERK_SIGN_UP_FALLBACK_REDIRECT_URL,CLERK_SIGN_UP_FORCE_REDIRECT_URL
      # env-parity-preserved: CLERK_OAUTH_CLIENT_ID,MCP_AUTHORIZATION_SERVER_URL,MCP_RESOURCE_URL,MCP_WIDGET_DOMAIN
      # env-parity-preserved: MCP_AUTH_ALLOW_SESSION_TOKEN,NEXTAUTH_URL,GOOGLE_CLOUD_PROJECT_ID,GOOGLE_CLOUD_LOCATION,PUBSUB_TOPIC
      # env-parity-preserved: PUBSUB_AUDIOBOOK_TOPIC,STORAGE_BUCKET_NAME,PUBLIC_STORAGE_BUCKET_NAME,STORY_GENERATION_WORKFLOW_URL
      # env-parity-preserved: ADMIN_API_URL,NOTIFICATION_ENGINE_URL,ANALYTICS_SCHEDULER_SERVICE_ACCOUNT,REFERRAL_PROGRAM_ENABLED
      # env-parity-preserved: REFERRAL_CAPTURE_ENABLED,REFERRAL_COMMISSION_ENABLED,REFERRAL_PORTAL_ENABLED,REFERRAL_MODE
      # env-parity-preserved: REFERRAL_PILOT_OWNER_IDS,REFERRAL_INTERNAL_AUDIENCE,REFERRAL_ADMIN_SERVICE_ACCOUNT
      # env-parity-preserved: REFERRAL_SCHEDULER_SERVICE_ACCOUNT,SURVEY_INTERNAL_AUDIENCE,SURVEY_ADMIN_SERVICE_ACCOUNT
      # env-parity-preserved: SURVEY_SCHEDULER_SERVICE_ACCOUNT
      # env-parity-preserved: BIOGRAPHER_ENABLED,BIOGRAPHER_LIVE_URL,BIOGRAPHER_ALLOWED_ORIGINS,BIOGRAPHER_STORAGE_BUCKET
      # env-parity-preserved: PREMIUM_BOOK_GENERATION_ENABLED,PREMIUM_BOOK_BUCKET
      # env-parity-preserved: PRINT_PROOF_BUCKET,PRINT_INTERNAL_AUDIENCE,PRINT_ADMIN_SERVICE_ACCOUNT,PRINT_SCHEDULER_SERVICE_ACCOUNT
      # env-parity-preserved: LULU_PRINT_ENVIRONMENT,LULU_PRINT_CLIENT_KEY,LULU_PRINT_CONTACT_EMAIL
      # env-parity-preserved: LULU_PAPERBACK_POD_PACKAGE_ID,LULU_HARDCOVER_POD_PACKAGE_ID
      # env-parity-preserved: LULU_PREMIUM_SQUARE_POD_PACKAGE_ID,PREMIUM_SQUARE_PRINT_APPROVAL
      # Existing Secret Manager bindings.
      # env-parity-preserved: DB_HOST,DB_USER,DB_PASSWORD,NEXTAUTH_SECRET,CLERK_SECRET_KEY,CLERK_WEBHOOK_SECRET
      # env-parity-preserved: CLERK_OAUTH_CLIENT_SECRET,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_GA_MEASUREMENT_ID
      # env-parity-preserved: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,KEYINVOICE_API_KEY
      # env-parity-preserved: ADMIN_API_KEY,NOTIFICATION_ENGINE_API_KEY,STORY_GENERATION_WORKFLOW_API_KEY,SGW_WEBHOOK_SECRET
      # env-parity-preserved: GOOGLE_ANALYTICS_API_SECRET,LEAD_BOUNCE_API_SECRET,SURVEY_LINK_SECRET,OPENAI_ADS_CAPI_KEY
      # env-parity-preserved: BIOGRAPHER_INTERNAL_API_KEY,LULU_PRINT_CLIENT_SECRET

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'

# Remove sensitive data from substitutions - all secrets now in Secret Manager
substitutions:
  _GIT_SHA: 'unknown'
  _NODE_VERSION: '24.18.1'
  _SERVICE_NAME: 'mythoria-webapp'
  _REGION: 'europe-west9'
  _NEXT_PUBLIC_BASE_URL: 'https://mythoria.pt'
  _ANALYTICS_DELIVERY_TARGET: 'off'
  _ANALYTICS_PRIVACY_PAUSE: 'false'
  _ANONYMOUS_ANALYTICS_ENABLED: 'true'
  _OPENAI_ADS_CAPI_DELIVERY_ENABLED: 'false'
  _NEXT_PUBLIC_SUPPORTED_LOCALES: 'en-US,pt-PT,es-ES,fr-FR,de-DE'
  _NEXT_PUBLIC_GOOGLE_ADS_ID: 'AW-17204783135'
  _NEXT_PUBLIC_GOOGLE_TAG_ID: 'GT-PBCDVJTJ'
  _NEXT_PUBLIC_OPENAI_PIXEL_ID: '8DT4ALLW8yvPUUYcaz21vb'
  _NEXT_PUBLIC_OPENAI_PIXEL_DEBUG: 'false'
  _NEXT_PUBLIC_TTS_PROVIDER: 'google-genai'
  _NEXT_PUBLIC_DEFAULT_CURRENCY: 'EUR'
  _NEXT_PUBLIC_APP_DOMAIN: 'mythoria.pt'
  _NEXT_PUBLIC_ASSETS_BASE_URL: 'https://storage.googleapis.com/mythoria-public/'
  _CLERK_SIGN_IN_URL: '/sign-in'
  _CLERK_SIGN_UP_URL: '/sign-up'
  _CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: '/my-stories'
  _CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: '/profile/onboarding'
  _CLERK_SIGN_UP_FORCE_REDIRECT_URL: '/profile/onboarding'
  _NEXT_PUBLIC_CLERK_IS_DEVELOPMENT: 'false'

options:
  # Use higher machine type for faster builds
  machineType: 'E2_HIGHCPU_8'
  # Enable disk size optimization
  diskSizeGb: '100'
